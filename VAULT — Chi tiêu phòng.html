<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>VAULT — Chi tiêu phòng</title>
<style>
:root{--bg:#0B0D0C;--s1:#171a18;--s2:#242724;--tx:#F5F0E6;--mu:#A1B2A3;--gold:#D7B56D;--em:#145B43;--bd:#2c332e;--er:#e58b7b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#F5F0E6;--s1:#fffaf0;--s2:#ebe4d4;--tx:#1a1d1b;--mu:#566358;--gold:#7d5f16;--em:#0D3328;--bd:#d8cfba;--er:#a3361f;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(900px 400px at 80% -10%,color-mix(in srgb,var(--em) 45%,transparent),transparent),var(--bg);color:var(--tx);font:15px/1.45 Inter,Manrope,system-ui,sans-serif;min-height:100vh;transition:background .3s,color .3s}
#app{max-width:760px;margin:0 auto;padding:16px 16px 96px}h1,h2,h3{margin:0;font-weight:600}.serif{font-family:Georgia,'Times New Roman',serif}
.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px}small,.mu{color:var(--mu);font-size:12.5px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0;animation:up .3s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip,button,select,input,textarea{font:inherit;color:var(--tx)}
.chip{background:var(--s2);border:1px solid var(--bd);border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer}.chip.on{border-color:var(--gold);color:var(--gold)}
.btn{background:var(--gold);color:#0B0D0C;border:0;border-radius:12px;padding:12px 16px;font-weight:600;min-height:44px;cursor:pointer}.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}.btn:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px;width:100%;min-height:44px}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:12.5px}
.big{font-size:30px;color:var(--gold)}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.row:first-child{border-top:0}
.acts{display:flex;gap:6px;margin-top:6px}.acts button{background:none;border:1px solid var(--bd);border-radius:8px;padding:4px 10px;cursor:pointer;min-height:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.mc{cursor:pointer;margin:0}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--em),var(--bd));border:1px solid var(--gold);display:inline-grid;place-items:center;color:var(--gold);font-weight:700}
.bar{height:8px;border-radius:9px;background:var(--s2);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--gold));transition:width .5s}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--s1) 94%,transparent);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:120px;background:none;border:0;border-radius:10px;padding:8px 2px;font-size:12px;color:var(--mu);cursor:pointer;min-height:44px}nav button.on{color:var(--gold)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 8px 24px #0008}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:5}#modal.on{display:flex}
#sheet{background:var(--bg);border:1px solid var(--bd);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px;animation:up .25s both}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--gold);border-radius:12px;padding:10px 16px;z-index:9;display:none;max-width:90%}#toast.er{border-color:var(--er)}
.er{color:var(--er)}pre{white-space:pre-wrap;background:var(--s2);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,monospace;max-height:50vh;overflow:auto}
#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;animation:sp 1.1s .5s forwards}@keyframes sp{to{opacity:0;visibility:hidden}}
.empty{text-align:center;padding:26px;color:var(--mu)}.cu{display:flex;align-items:center;gap:10px;margin-top:6px}.cu input{max-width:170px}
</style></head><body>
<div id="splash"><svg class="logo" style="width:84px;height:84px" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0D3328" stroke="#D7B56D"/><path d="M18 20l14 26 14-26" fill="none" stroke="#D7B56D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="app"></div><nav id="nav"></nav><div id="modal" onclick="if(event.target==this)closeM()"><div id="sheet"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),F=n=>Math.round(n).toLocaleString('vi-VN')+' ₫';
const nowVN=()=>new Date().toLocaleString('sv-SE',{timeZone:'Asia/Ho_Chi_Minh'}).replace(' ','T').slice(0,16);
const CATS=['Đồ ăn','Nước uống','Đồ vệ sinh','Điện','Nước sinh hoạt','Internet','Đồ dùng chung','Đi lại','Mua sắm','Chi phí cá nhân','Khác'];
const DN=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const dmy=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4),wd=d=>DN[new Date(d+'T00:00:00Z').getUTCDay()];
function load(){try{const j=JSON.parse(localStorage.getItem('vault_v1'));if(j&&j.members)return j}catch(e){}return{members:['Minh','Dương','Tùng','Trường'].map((n,i)=>({id:'m'+i,name:n})),tx:[],st:[],debt:true,theme:'dark'}}
let S=load(),tab='home',per='month',cf='',ct='',q='',f=null,busy=0,det=false;
function save(){try{localStorage.setItem('vault_v1',JSON.stringify(S))}catch(e){toast('Không lưu được vào trình duyệt',1)}}
const mn=i=>esc(S.members.find(m=>m.id==i)?.name||'?'),mr=i=>S.members.find(m=>m.id==i)?.name||'?',live=()=>S.tx.filter(x=>!x.del);
const add=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
function range(){const t=nowVN().slice(0,10),ms=t.slice(0,7)+'-01',eom=m=>{const[y,o]=m.split('-').map(Number);return new Date(Date.UTC(y,o,0)).toISOString().slice(0,10)};
if(per=='today')return[t,t];if(per=='7d')return[add(t,-6),t];if(per=='month')return[ms,eom(ms)];if(per=='last'){const e=add(ms,-1);return[e.slice(0,7)+'-01',e]}return[cf||'0000-00-00',ct||'9999-99-99']}
const inR=(x,a,b)=>x.ts.slice(0,10)>=a&&x.ts.slice(0,10)<=b;
function stats(L){const sh={},pd={},c={};S.members.forEach(m=>sh[m.id]=pd[m.id]=c[m.id]=0);let tot=0;L.forEach(x=>{tot+=x.amt;pd[x.payer]=(pd[x.payer]||0)+x.amt;for(const k in x.al){sh[k]=(sh[k]||0)+x.al[k];if(x.al[k]>0)c[k]++}});return{sh,pd,c,tot}}
function bals(){const s=stats(live()),b={};S.members.forEach(m=>b[m.id]=s.pd[m.id]-s.sh[m.id]);S.st.filter(z=>!z.del).forEach(z=>{b[z.from]+=z.amt;b[z.to]-=z.amt});return b}
function catSum(L,id){const c={};L.forEach(x=>{const v=id?(x.al[id]||0):x.amt;if(v)c[x.cat]=(c[x.cat]||0)+v});return Object.entries(c).sort((p,r)=>r[1]-p[1])}
function toast(m,er,undo){const t=$('#toast');t.className=er?'er':'';t.innerHTML=esc(m)+(undo?' <button class="btn g" style="min-height:32px;padding:4px 10px" onclick="undoF()">Hoàn tác</button>':'');t.style.display='block';window.undoF=()=>{undo();t.style.display='none'};clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',undo?6000:2600)}
function openM(h){$('#sheet').innerHTML=h;$('#modal').classList.add('on')}function closeM(){$('#modal').classList.remove('on');f=null}
const row=(x,acts)=>`<div class=row><div><b>${esc(x.title)}</b><br><small>${dmy(x.ts)} ${x.ts.slice(11)} · ${esc(x.cat)} · Trả: ${mn(x.payer)} · Chịu: ${Object.keys(x.al).map(mn).join(', ')}${x.note?' · '+esc(x.note):''}</small>${acts?`<div class=acts><button onclick="ed('${x.id}')">Sửa</button><button onclick="cp('${x.id}')">Sao chép</button><button onclick="rm('${x.id}')">Xóa</button></div>`:''}</div><b>${F(x.amt)}</b></div>`;
function home(){const[a,b]=range(),L=live().filter(x=>inR(x,a,b)),s=stats(L),bl=bals(),ce=catSum(L),h=+nowVN().slice(11,13),t=nowVN().slice(0,10);
return`<div class=brand><svg class=logo viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0D3328" stroke="#D7B56D"/><path d="M18 20l14 26 14-26" fill="none" stroke="#D7B56D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div><h2 class=serif>VAULT</h2><small>${wd(t)}, ${dmy(t)} · ${h<12?'Chào buổi sáng':h<18?'Chào buổi chiều':'Chào buổi tối'}</small></div></div>
<div class=chips>${[['today','Hôm nay'],['7d','7 ngày qua'],['month','Tháng này'],['last','Tháng trước'],['cu','Tùy chỉnh']].map(p=>`<button class="chip ${per==p[0]?'on':''}" onclick="per='${p[0]}';render()">${p[1]}</button>`).join('')}</div>
${per=='cu'?`<div class=grid><input type=date value="${cf}" onchange="cf=this.value;render()" aria-label="Từ ngày"><input type=date value="${ct}" onchange="ct=this.value;render()" aria-label="Đến ngày"></div>`:''}
<div class=card><small>Tổng chi tiêu của nhóm · ${dmy(a.length==10&&a>'0001'?a:t)} – ${dmy(b<'9999'?b:t)}</small><div class="big serif">${F(s.tot)}</div><small>${L.length} giao dịch</small></div>
<div class=grid>${S.members.map(m=>`<div class="card mc" onclick="mem('${m.id}')"><span class=av>${esc(m.name[0]||'?')}</span> <b>${esc(m.name)}</b><br><small>Tổng</small><div class="big serif" style="font-size:24px">${F(s.sh[m.id])}</div><small>${s.tot?Math.round(s.sh[m.id]/s.tot*100):0}% · ${s.c[m.id]} giao dịch<br>Đã thanh toán: ${F(s.pd[m.id])}${S.debt?'<br>'+(bl[m.id]>0?'Được nhận lại '+F(bl[m.id]):bl[m.id]<0?'Cần trả '+F(-bl[m.id]):'Đã cân bằng'):''}</small></div>`).join('')}</div>
${S.debt?'<small>Công nợ tính trên toàn bộ thời gian: đã thanh toán − phần chịu ± hoàn trả.</small>':''}
<div class=card><h3>Phân bổ theo danh mục</h3>${ce.length?ce.map(c=>`<div class=row style="border:0;padding:6px 0 0"><span>${esc(c[0])}</span><b>${F(c[1])}</b></div><div class=bar><i style="width:${Math.round(c[1]/s.tot*100)}%"></i></div>`).join(''):'<div class=empty>Chưa có giao dịch trong kỳ này.</div>'}</div>
<div class=card><h3>Giao dịch gần đây</h3>${L.length?[...L].sort((p,r)=>r.ts.localeCompare(p.ts)).slice(0,5).map(x=>row(x)).join(''):'<div class=empty>Nhấn + để ghi khoản chi đầu tiên.</div>'}</div>`}
function mem(id){const[a,b]=range(),L=live().filter(x=>inR(x,a,b)&&x.al[id]),s=stats(live().filter(x=>inR(x,a,b)));
openM(`<h2>${mn(id)}</h2><small>${dmy(a>'0001'?a:nowVN())} – ${dmy(b<'9999'?b:nowVN())}</small><div class=card><small>Tổng chi phí được phân bổ</small><div class="big serif">${F(s.sh[id])}</div><small>Đã thanh toán: ${F(s.pd[id])}</small></div>${catSum(L,id).map(c=>`<div class=row><span>${esc(c[0])}</span><b>${F(c[1])}</b></div>`).join('')}<h3 style="margin-top:14px">Các khoản chi</h3>${L.map(x=>`<div class=row><div><b>${esc(x.title)}</b><br><small>${dmy(x.ts)} · ${esc(x.cat)}</small></div><b>${F(x.al[id])}</b></div>`).join('')||'<div class=empty>Chưa có khoản chi.</div>'}<button class="btn g" style="width:100%;margin-top:12px" onclick="closeM()">Đóng</button>`)}
function hist(){const L=live().filter(x=>{const k=(x.title+' '+x.cat+' '+Object.keys(x.al).map(mr).join(' ')+' '+mr(x.payer)+' '+x.amt+' '+dmy(x.ts)).toLowerCase();return k.includes(q.toLowerCase())||dmy(x.ts).startsWith(q.replace(/\/$/,''))}).sort((p,r)=>r.ts.localeCompare(p.ts)),g={};L.forEach(x=>(g[x.ts.slice(0,10)]=g[x.ts.slice(0,10)]||[]).push(x));const D=S.tx.filter(x=>x.del);
return`<h2 class=serif>Lịch sử</h2><input placeholder="Tìm tên, người, danh mục, số tiền, ngày (vd 12/10)" value="${esc(q)}" oninput="q=this.value;hl()" aria-label="Tìm kiếm" style="margin-top:10px"><div id=hl>${hlist(g,D)}</div>`}
function hlist(g,D){return(Object.keys(g).sort().reverse().map(d=>`<div class=card><div class=row style="border:0;padding-top:0"><b>${wd(d)}, ${dmy(d)}</b><b style="color:var(--gold)">${F(g[d].reduce((p,x)=>p+x.amt,0))}</b></div>${g[d].map(x=>row(x,1)).join('')}</div>`).join('')||'<div class="card empty">Chưa có giao dịch.</div>')+(D.length?`<div class=card><small>Đã xóa (${D.length})</small>${D.map(x=>`<div class=row><span>${esc(x.title)} · ${F(x.amt)}</span><button class="btn g" style="min-height:32px;padding:4px 10px" onclick="rs('${x.id}')">Khôi phục</button></div>`).join('')}</div>`:'')}
function hl(){const t=hist();$('#app').innerHTML=t;const i=$('#app input');i.focus();i.setSelectionRange(99,99)}
const rm=id=>{const x=S.tx.find(z=>z.id==id);x.del=1;save();render();toast('Đã xóa',0,()=>rs(id))},rs=id=>{S.tx.find(z=>z.id==id).del=0;save();render()};
const ed=id=>openF(S.tx.find(x=>x.id==id)),cp=id=>openF({...S.tx.find(x=>x.id==id),id:null,ts:null});
function calc(){const ids=S.members.map(m=>m.id).filter(i=>f.sel.has(i)),al={};if(f.mode=='cu')ids.forEach(i=>al[i]=f.cu[i]||0);else if(ids.length){const b=Math.floor(f.amt/ids.length);let r=f.amt-b*ids.length;ids.forEach(i=>al[i]=b+(r-->0?1:0))}return al}
function openF(x){const t=x||{};f={id:t.id||null,amt:t.amt||0,mode:t.mode||'eq',sel:new Set(t.al?Object.keys(t.al):S.members.map(m=>m.id)),cu:{...(t.al||{})}};
openM(`<h2>${f.id?'Sửa giao dịch':'Thêm giao dịch'}</h2><label for=fa>Tổng số tiền (₫)</label><input id=fa inputmode=numeric style="font-size:28px" value="${f.amt?f.amt.toLocaleString('vi-VN'):''}" oninput="fa(this)" placeholder="0"><label for=ft>Tên khoản chi</label><input id=ft value="${esc(t.title||'')}"><div class=grid><div><label for=fd>Ngày giờ</label><input id=fd type=datetime-local value="${t.ts||nowVN()}"></div><div><label for=fc>Danh mục</label><select id=fc>${CATS.map(c=>`<option ${c==(t.cat||'Đồ ăn')?'selected':''}>${c}</option>`).join('')}</select></div></div><label for=fp>Người thực tế thanh toán</label><select id=fp>${S.members.map(m=>`<option value=${m.id} ${m.id==(t.payer||S.members[0].id)?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
<label>Cách phân bổ</label><div class=chips id=fmode></div><label>Người chịu chi phí</label><div id=fm></div><p id=pv class=mu></p><label for=fn>Ghi chú</label><input id=fn value="${esc(t.note||'')}"><div class=grid style="margin-top:14px"><button class="btn g" onclick="closeM()">Hủy</button><button class=btn onclick="sv()">Lưu</button></div>`);fmd();fm();pv()}
const fa=e=>{const n=+(e.value.replace(/\D/g,''))||0;f.amt=n;e.value=n?n.toLocaleString('vi-VN'):'';pv()};
function fmd(){$('#fmode').innerHTML=[['eq','Chia đều'],['cu','Nhập riêng'],['pe','Chi phí cá nhân']].map(m=>`<button class="chip ${f.mode==m[0]?'on':''}" onclick="sm('${m[0]}')">${m[1]}</button>`).join('')}
function sm(m){if(f.mode!='cu')f.cu=calc();f.mode=m;if(m=='pe'){const k=S.members.find(x=>f.sel.has(x.id))||S.members[0];f.sel=new Set([k.id])}fmd();fm();pv()}
function tg(i){if(f.mode=='pe')f.sel=new Set([i]);else f.sel.has(i)?f.sel.delete(i):f.sel.add(i);if(f.mode=='cu')f.cu=Object.fromEntries([...f.sel].map(k=>[k,f.cu[k]||0]));fm();pv()}
function fm(){$('#fm').innerHTML=`<div class=chips>${S.members.map(m=>`<button class="chip ${f.sel.has(m.id)?'on':''}" onclick="tg('${m.id}')">${esc(m.name)}</button>`).join('')}</div>`+(f.mode=='cu'?S.members.filter(m=>f.sel.has(m.id)).map(m=>`<div class=cu><span style="min-width:70px">${esc(m.name)}</span><input inputmode=numeric value="${f.cu[m.id]?f.cu[m.id].toLocaleString('vi-VN'):''}" oninput="cu('${m.id}',this)" aria-label="Số tiền ${esc(m.name)}"></div>`).join(''):'')}
function cu(i,e){const n=+(e.value.replace(/\D/g,''))||0;f.cu[i]=n;e.value=n?n.toLocaleString('vi-VN'):'';pv()}
function pv(){const al=calc(),d=f.amt-Object.values(al).reduce((p,v)=>p+v,0),p=$('#pv');p.className=d?'er':'mu';p.innerHTML=(Object.keys(al).map(i=>mn(i)+': <b>'+F(al[i])+'</b>').join(' · ')||'Chọn người chịu chi phí')+(d?`<br>Chênh lệch chưa phân bổ: ${F(d)}`:'')}
function sv(){if(busy)return;const al=calc(),sum=Object.values(al).reduce((p,v)=>p+v,0),title=$('#ft').value.trim();
if(!title||f.amt<=0||!Object.keys(al).length)return toast('Nhập tên, số tiền và người chịu chi phí',1);if(sum!=f.amt)return toast('Tổng phân bổ chưa khớp, lệch '+F(f.amt-sum),1);
busy=1;const o={title,amt:f.amt,ts:$('#fd').value||nowVN(),cat:$('#fc').value,payer:$('#fp').value,mode:f.mode,note:$('#fn').value.trim(),al:Object.fromEntries(Object.entries(al).filter(e=>e[1]>0)),upd:Date.now()};
if(f.id)Object.assign(S.tx.find(x=>x.id==f.id),o);else S.tx.push({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),cr:Date.now(),...o});
save();closeM();toast('Đã lưu giao dịch');render();setTimeout(()=>busy=0,400)}
function pay(){const st=S.st.filter(z=>!z.del).sort((a,b)=>b.ts.localeCompare(a.ts)),o=S.members.map(m=>`<option value=${m.id}>${esc(m.name)}</option>`).join('');
return`<h2 class=serif>Hoàn trả</h2><small>Hoàn trả không phải chi tiêu mới và không cộng vào “Tổng”.</small><div class=card><div class=grid><div><label for=sf>Người chuyển</label><select id=sf>${o}</select></div><div><label for=stt>Người nhận</label><select id=stt>${o.replace('value=m0','value=m0').replace(/<option value=m1/,'<option selected value=m1')}</select></div></div><label for=sa>Số tiền (₫)</label><input id=sa inputmode=numeric oninput="this.value=(+this.value.replace(/\\D/g,'')||'').toLocaleString('vi-VN')"><label for=sn>Ghi chú</label><input id=sn><button class=btn style="margin-top:12px;width:100%" onclick="addS()">Ghi nhận hoàn trả</button></div>
<div class=card><h3>Lịch sử hoàn trả</h3>${st.map(z=>`<div class=row><div>${mn(z.from)} → ${mn(z.to)}<br><small>${dmy(z.ts)} ${z.ts.slice(11)} ${esc(z.note||'')}</small></div><div><b>${F(z.amt)}</b> <button class="btn g" style="min-height:32px;padding:4px 10px" onclick="delS('${z.id}')">Xóa</button></div></div>`).join('')||'<div class=empty>Chưa có hoàn trả.</div>'}</div>`}
function addS(){const a=+($('#sa').value.replace(/\D/g,'')),fr=$('#sf').value,to=$('#stt').value;if(fr==to||a<=0)return toast('Chọn hai người khác nhau và nhập số tiền',1);S.st.push({id:'s'+Date.now().toString(36),from:fr,to,amt:a,ts:nowVN(),note:$('#sn').value.trim()});save();toast('Đã ghi nhận');render()}
const delS=id=>{S.st.find(z=>z.id==id).del=1;save();render();toast('Đã xóa hoàn trả',0,()=>{S.st.find(z=>z.id==id).del=0;save();render()})};
function reportText(){const[a,b]=range(),L=live().filter(x=>inR(x,a,b)),s=stats(L),ST=S.st.filter(z=>!z.del&&z.ts.slice(0,10)>=a&&z.ts.slice(0,10)<=b);let t=`BÁO CÁO CHI TIÊU PHÒNG\nKỳ: ${dmy(a>'0001'?a:nowVN())} – ${dmy(b<'9999'?b:nowVN())}\n`;
S.members.forEach(m=>{const l=L.filter(x=>x.al[m.id]);t+=`\n${m.name}\n`;catSum(L,m.id).forEach(c=>t+=`- ${c[0]}: ${F(c[1])}\n`);if(det)l.forEach(x=>t+=`   · ${dmy(x.ts).slice(0,5)} ${x.title}: ${F(x.al[m.id])}\n`);t+=`- Tổng: ${F(s.sh[m.id])}\n`});
t+=`\nTỔNG KẾT NHÓM\n- Tổng chi phí: ${F(s.tot)}\n- Số giao dịch: ${L.length}\n- Đã thanh toán: ${S.members.map(m=>m.name+' '+F(s.pd[m.id])).join(', ')}\n- Hoàn trả: ${F(ST.reduce((p,z)=>p+z.amt,0))}\n`;if(S.debt){const bl=bals();t+=`- Số dư (toàn thời gian, + được nhận / − cần trả): ${S.members.map(m=>m.name+' '+(bl[m.id]>0?'+':'')+F(bl[m.id])).join(', ')}\n`}return t}
function rep(){return`<h2 class=serif>Báo cáo</h2><small>Theo kỳ đang chọn ở Tổng quan. Tính trực tiếp từ giao dịch.</small><div class=chips>${[['today','Ngày'],['7d','7 ngày'],['month','Tháng này'],['last','Tháng trước']].map(p=>`<button class="chip ${per==p[0]?'on':''}" onclick="per='${p[0]}';render()">${p[1]}</button>`).join('')}<button class="chip ${det?'on':''}" onclick="det=!det;render()">Chi tiết</button></div><pre id=rt>${esc(reportText())}</pre><button class=btn style="width:100%" onclick="cpy($('#rt').textContent)">Sao chép báo cáo</button>`}
function cpy(t){const ok=()=>toast('Đã sao chép');if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,fb);else fb();function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Hãy chọn và sao chép thủ công',1)}a.remove()}}
function set(){return`<h2 class=serif>Cài đặt</h2><div class=card><h3>Thành viên</h3>${S.members.map((m,i)=>`<label for=n${i}>Thành viên ${i+1}</label><input id=n${i} value="${esc(m.name)}" onchange="S.members[${i}].name=this.value.trim()||S.members[${i}].name;save();toast('Đã đổi tên')">`).join('')}</div>
<div class=card><div class=chips><button class=chip onclick="S.theme=S.theme=='light'?'dark':'light';th();save();render()">Giao diện: ${S.theme=='light'?'Sáng':'Tối'}</button><button class=chip onclick="S.debt=!S.debt;save();render()">Theo dõi công nợ: ${S.debt?'Bật':'Tắt'}</button></div></div>
<div class=card><h3>Sao lưu</h3><small>Dữ liệu chỉ lưu trong trình duyệt này; xóa dữ liệu trình duyệt sẽ mất. Hãy sao chép bản sao lưu định kỳ.</small><button class=btn style="width:100%;margin-top:8px" onclick="cpy(JSON.stringify(S))">Sao chép bản sao lưu (JSON)</button><label for=rb>Khôi phục: dán JSON</label><textarea id=rb rows=3></textarea><button class="btn g" style="width:100%;margin-top:8px" onclick="rst()">Ghi đè dữ liệu bằng bản sao lưu này</button></div><small>VAULT v1.0 · giờ Asia/Ho_Chi_Minh</small>`}
function rst(){try{const j=JSON.parse($('#rb').value);if(!Array.isArray(j.members)||j.members.length!=4||!Array.isArray(j.tx)||!Array.isArray(j.st))throw 0;j.tx.forEach(x=>{if(!Number.isInteger(x.amt)||Object.values(x.al).reduce((p,v)=>p+v,0)!=x.amt)throw 0});S=j;save();th();toast('Đã khôi phục');render()}catch(e){toast('Bản sao lưu không hợp lệ, chưa ghi gì',1)}}
const th=()=>document.documentElement.dataset.theme=S.theme||'dark';
function render(){th();$('#app').innerHTML=({home,hist,pay,rep,set})[tab]()+(tab=='home'||tab=='hist'?'<button class="btn fab" onclick="openF()" aria-label="Thêm giao dịch">+</button>':'');
$('#nav').innerHTML=[['home','Tổng quan'],['hist','Lịch sử'],['pay','Hoàn trả'],['rep','Báo cáo'],['set','Cài đặt']].map(p=>`<button class="${tab==p[0]?'on':''}" onclick="tab='${p[0]}';render()">${p[1]}</button>`).join('')}
render();
</script></body></html>
